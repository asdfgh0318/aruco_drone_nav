# ArUco Marker Map Configuration
# Coordinate system (NED): X=North, Y=East, Z=Down
# Origin (0,0,0) is on the floor at the starting/takeoff position

origin:
  description: "Takeoff position on the floor"
  x: 0.0
  y: 0.0
  z: 0.0

ceiling_height: 2.0

# ArUco markers (DICT_4X4_50, 20cm on A4, no white border)
# L-shaped layout: IDs 0-8 going South, IDs 9-17 going West, 70cm spacing
markers:
  # === South corridor (N decreasing, E=0) ===
  - id: 0
    position: [0.00, 0.00, 2.00]
    orientation: 0
    size: 0.20

  - id: 1
    position: [-0.70, 0.00, 2.00]
    orientation: 0
    size: 0.20

  - id: 2
    position: [-1.40, 0.00, 2.00]
    orientation: 0
    size: 0.20

  - id: 3
    position: [-2.10, 0.00, 2.00]
    orientation: 0
    size: 0.20

  - id: 4
    position: [-2.80, 0.00, 2.00]
    orientation: 0
    size: 0.20

  - id: 5
    position: [-3.50, 0.00, 2.00]
    orientation: 0
    size: 0.20

  - id: 6
    position: [-4.20, 0.00, 2.00]
    orientation: 0
    size: 0.20

  - id: 7
    position: [-4.90, 0.00, 2.00]
    orientation: 0
    size: 0.20

  - id: 8
    position: [-5.60, 0.00, 2.00]
    orientation: 0
    size: 0.20

  # === West corridor (E decreasing, N=-5.60) ===
  - id: 9
    position: [-5.60, -0.70, 2.00]
    orientation: 0
    size: 0.20

  - id: 10
    position: [-5.60, -1.40, 2.00]
    orientation: 0
    size: 0.20

  - id: 11
    position: [-5.60, -2.10, 2.00]
    orientation: 0
    size: 0.20

  - id: 12
    position: [-5.60, -2.80, 2.00]
    orientation: 0
    size: 0.20

  - id: 13
    position: [-5.60, -3.50, 2.00]
    orientation: 0
    size: 0.20

  - id: 14
    position: [-5.60, -4.20, 2.00]
    orientation: 0
    size: 0.20

  - id: 15
    position: [-5.60, -4.90, 2.00]
    orientation: 0
    size: 0.20

  - id: 16
    position: [-5.60, -5.60, 2.00]
    orientation: 0
    size: 0.20

  - id: 17
    position: [-5.60, -6.30, 2.00]
