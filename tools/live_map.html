<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ArUco Drone Live Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Consolas', monospace; overflow: hidden; }
  #top { display: flex; justify-content: space-between; padding: 8px 15px; background: #16213e; border-bottom: 1px solid #333; }
  #top input { background: #0d1117; color: #e0e0e0; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; width: 220px; }
  #top button { background: #4a9eff; color: #000; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  #top button:hover { background: #7db8ff; }
  #top .status { font-size: 13px; line-height: 28px; }
  .ok { color: #4ade80; } .err { color: #ff6b6b; } .warn { color: #ffa500; }
  #canvas-wrap { position: relative; width: 100vw; height: calc(100vh - 40px); }
  canvas { display: block; width: 100%; height: 100%; }
  #stats { position: absolute; bottom: 10px; left: 10px; background: rgba(13,17,23,0.85); padding: 10px 15px; border-radius: 8px; font-size: 13px; line-height: 1.6; border: 1px solid #333; min-width: 200px; }
  #angles { position: absolute; top: 10px; right: 10px; background: rgba(13,17,23,0.85); padding: 15px; border-radius: 8px; border: 1px solid #333; }
  #angles canvas { display: block; margin-bottom: 8px; }
  #angles .label { font-size: 11px; color: #888; text-align: center; margin-bottom: 5px; }
  #stats .val { color: #7dd3fc; }

  /* Snapshot viewer */
  #snap-wrap {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(13,17,23,0.92); border: 1px solid #333; border-radius: 8px;
    padding: 8px; display: none; z-index: 20;
  }
  #snap-wrap img { max-width: 400px; max-height: 300px; border-radius: 4px; display: block; }
  #snap-wrap .snap-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #snap-wrap .snap-bar span { font-size: 11px; color: #888; }
  #snap-wrap .snap-bar button { background: #0f3460; color: #e0e0e0; border: 1px solid #1a4080; padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  #snap-wrap .snap-bar button:hover { background: #1a4080; }
  #snap-close { cursor: pointer; color: #666; font-size: 14px; margin-left: 8px; }
  #snap-close:hover { color: #ff6b6b; }

  /* Camera config panel */
  #cam-panel {
    position: absolute; top: 10px; left: 10px;
    background: rgba(13,17,23,0.92); border: 1px solid #333; border-radius: 8px;
    padding: 10px 14px; font-size: 12px; display: none; z-index: 20;
    min-width: 260px;
  }
  #cam-panel .cp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #cam-panel .cp-header b { color: #e94560; }
  #cam-panel .cp-close { cursor: pointer; color: #666; font-size: 14px; }
  #cam-panel .cp-close:hover { color: #ff6b6b; }
  .cam-ctrl { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .cam-ctrl label { font-size: 11px; color: #888; min-width: 80px; }
  .cam-ctrl input[type=number] {
    width: 70px; padding: 2px 4px; font-size: 11px; font-family: monospace;
    background: #0a1830; color: #7dd3fc; border: 1px solid #0f3460; border-radius: 3px; text-align: right;
  }
</style>
</head>
<body>

<div id="top">
  <div>
    <input id="host" type="text" value="192.168.213.251:8001" placeholder="host:port">
    <button onclick="toggle()">Connect</button>
    <label style="background:#4a3080;color:#e0e0e0;border:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px;margin-left:8px">
      YAML<input type="file" id="yaml-input" accept=".yaml,.yml" style="display:none">
    </label>
    <button id="snap-btn" style="background:#0f6460;margin-left:8px" title="Capture frame (S)">SNAP</button>
    <button id="cam-btn" style="background:#604a0f;margin-left:4px" title="Camera config (K)">CAM</button>
  </div>
  <div class="status" id="status">Disconnected</div>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="stats"></div>
  <div id="angles">
    <div class="label">PITCH (side view)</div>
    <canvas id="pitch-gauge" width="200" height="120"></canvas>
    <div class="label">ROLL (front view)</div>
    <canvas id="roll-gauge" width="200" height="120"></canvas>
    <div id="body-tvec" style="font-size:11px;color:#888;margin-top:8px;padding-top:8px;border-top:1px solid #333;line-height:1.6">
      <div class="label">CODE in body (R_CB)</div>
      <div>fwd: <span id="bt-fwd" class="val">—</span></div>
      <div>right: <span id="bt-right" class="val">—</span></div>
      <div>down: <span id="bt-down" class="val">—</span></div>
      <div class="label" style="margin-top:6px">Body offset (step4)</div>
      <div>fwd: <span id="bo-fwd" class="val">—</span></div>
      <div>right: <span id="bo-right" class="val">—</span></div>
      <div>down: <span id="bo-down" class="val">—</span></div>
    </div>
  </div>

  <!-- Snapshot viewer -->
  <div id="snap-wrap">
    <div class="snap-bar">
      <span id="snap-time"></span>
      <div>
        <button id="snap-refresh">Refresh</button>
        <span id="snap-close">&#x2715;</span>
      </div>
    </div>
    <img id="snap-img" alt="No frame">
  </div>

  <!-- Camera config panel -->
  <div id="cam-panel">
    <div class="cp-header">
      <b>Camera Config</b>
      <span class="cp-close" id="cam-close">&#x2715;</span>
    </div>
    <div id="cam-controls"></div>
    <button id="cam-reload" style="margin-top:6px;width:100%;padding:4px;background:#0f3460;color:#e0e0e0;border:1px solid #1a4080;border-radius:4px;cursor:pointer;font-size:11px">Reload from camera</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, scale = 100; // pixels per meter
let cx, cy; // canvas center (world origin)
let trail = [];
const MAX_TRAIL = 500;
let drone = null;
let fcDrone = null; // FC's EKF position estimate
let fcTrail = [];
let activeWeights = {}; // {id: weight} from server
let markers = []; // load via YAML button or /markers endpoint
let polling = null;
let lastData = null;
let panX = 0, panY = 0;
let dragging = false, dragStart = {x:0, y:0}, panStart = {x:0, y:0};

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  W = canvas.width; H = canvas.height;
  cx = W/2 + panX; cy = H/2 + panY;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// World to canvas (plan view from above: E=right, N=up)
// NED: first arg = North, second arg = East
function w2c(n, e) {
  return [cx + e * scale, cy - n * scale]; // East=right, North=up
}

function drawGrid() {
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 0.5;
  const step = scale >= 50 ? 1 : (scale >= 20 ? 2 : 5);
  const left = -cx / scale, right = (W - cx) / scale;
  const top_ = -(H - cy) / scale, bottom = cy / scale;
  for (let x = Math.floor(left/step)*step; x <= right; x += step) {
    const [sx] = w2c(x, 0);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H/devicePixelRatio); ctx.stroke();
  }
  for (let y = Math.floor(top_/step)*step; y <= bottom; y += step) {
    const [, sy] = w2c(0, y);
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W/devicePixelRatio, sy); ctx.stroke();
  }
  // Axes
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
  const [ox, oy] = w2c(0, 0);
  ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W/devicePixelRatio, oy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H/devicePixelRatio); ctx.stroke();
  // Labels
  ctx.fillStyle = '#555'; ctx.font = '11px Consolas';
  ctx.fillText('E +Y', W/devicePixelRatio - 40, oy - 5);
  ctx.fillText('N +X', ox + 5, 15);
}

function drawMarkers() {
  markers.forEach(m => {
    const [sx, sy] = w2c(m.n, m.e);
    const w = activeWeights[String(m.id)];
    const active = w !== undefined;
    const color = active ? '#4ade80' : '#555';
    ctx.fillStyle = color;
    ctx.fillRect(sx - 8, sy - 8, 16, 16);
    ctx.strokeStyle = active ? '#4ade80' : '#777'; ctx.lineWidth = active ? 2 : 1;
    ctx.strokeRect(sx - 12, sy - 12, 24, 24);

    // Orientation arrow (orange) — NED: 0°=North(up), 90°=East(right), CW
    const ori = m.orientation || 0;
    const rad = ori * Math.PI / 180;
    const arrowLen = 18;
    const ax = sx + Math.sin(rad) * arrowLen;
    const ay = sy - Math.cos(rad) * arrowLen;
    ctx.strokeStyle = '#ff6600'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ax, ay); ctx.stroke();
    const headLen = 5, headAng = 0.5;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - headLen * Math.sin(rad - headAng), ay + headLen * Math.cos(rad - headAng));
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - headLen * Math.sin(rad + headAng), ay + headLen * Math.cos(rad + headAng));
    ctx.stroke();

    // Label
    ctx.fillStyle = active ? '#fff' : '#888'; ctx.font = '11px Consolas';
    ctx.fillText('M' + m.id + ' ' + ori + '°', sx + 15, sy + 4);
    if (active) {
      ctx.fillStyle = '#ffa500'; ctx.font = 'bold 12px Consolas';
      ctx.fillText((w * 100).toFixed(0) + '%', sx + 15, sy + 18);
    }
  });
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(74, 158, 255, 0.4)';
  ctx.lineWidth = 2;
  const [sx0, sy0] = w2c(trail[0].n, trail[0].e);
  ctx.moveTo(sx0, sy0);
  for (let i = 1; i < trail.length; i++) {
    const [sx, sy] = w2c(trail[i].n, trail[i].e);
    ctx.lineTo(sx, sy);
  }
  ctx.stroke();

  // Trail dots
  trail.forEach((p, i) => {
    if (i % 5 !== 0) return;
    const [sx, sy] = w2c(p.n, p.e);
    const alpha = 0.1 + 0.5 * (i / trail.length);
    ctx.fillStyle = `rgba(74, 158, 255, ${alpha})`;
    ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI*2); ctx.fill();
  });
}

function drawDrone(n, e, yaw) {
  const [sx, sy] = w2c(n, e);
  const rad = yaw * Math.PI / 180; // compass: 0=N(up), 90=E(right), 180=S(down)
  const size = 18;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rad);

  // Body
  ctx.fillStyle = '#4ade80';
  ctx.beginPath();
  ctx.moveTo(0, -size);        // nose
  ctx.lineTo(-size*0.6, size*0.5);
  ctx.lineTo(0, size*0.2);
  ctx.lineTo(size*0.6, size*0.5);
  ctx.closePath();
  ctx.fill();

  // Outline
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Center dot
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();

  ctx.restore();

  // Position text
  ctx.fillStyle = '#4ade80'; ctx.font = '12px Consolas';
  ctx.fillText(`(${n.toFixed(2)}, ${e.toFixed(2)})`, sx + 22, sy - 5);
  ctx.fillText(`yaw: ${yaw.toFixed(1)}`, sx + 22, sy + 10);
}

function drawFcDrone(n, e, yaw) {
  const [sx, sy] = w2c(n, e);
  const rad = yaw * Math.PI / 180;
  const size = 14;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rad);

  // Body - orange/red for FC
  ctx.fillStyle = 'rgba(255, 140, 0, 0.5)';
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.lineTo(-size*0.6, size*0.5);
  ctx.lineTo(0, size*0.2);
  ctx.lineTo(size*0.6, size*0.5);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#ff8c00';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#ff8c00';
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fill();

  ctx.restore();

  ctx.fillStyle = '#ff8c00'; ctx.font = '11px Consolas';
  ctx.fillText(`FC (${n.toFixed(2)}, ${e.toFixed(2)})`, sx + 20, sy - 5);
  ctx.fillText(`yaw: ${yaw.toFixed(1)}`, sx + 20, sy + 8);
}

function drawFcTrail() {
  if (fcTrail.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(255, 140, 0, 0.3)';
  ctx.lineWidth = 1.5;
  const [sx0, sy0] = w2c(fcTrail[0].n, fcTrail[0].e);
  ctx.moveTo(sx0, sy0);
  for (let i = 1; i < fcTrail.length; i++) {
    const [sx, sy] = w2c(fcTrail[i].n, fcTrail[i].e);
    ctx.lineTo(sx, sy);
  }
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W/devicePixelRatio, H/devicePixelRatio);
  cx = W/(2*devicePixelRatio) + panX;
  cy = H/(2*devicePixelRatio) + panY;
  drawGrid();
  drawMarkers();
  drawTrail();
  drawFcTrail();
  if (drone) drawDrone(drone.n, drone.e, drone.yaw);
  if (fcDrone) drawFcDrone(fcDrone.n, fcDrone.e, fcDrone.yaw);
  requestAnimationFrame(draw);
}
draw();

// Polling
async function fetchMarkers() {
  const host = document.getElementById('host').value;
  try {
    const r = await fetch(`http://${host}/markers`, {signal: AbortSignal.timeout(2000)});
    markers = await r.json();
  } catch(e) { /* keep defaults */ }
}

function toggle() {
  if (polling) { clearInterval(polling); polling = null; document.getElementById('status').innerHTML = '<span class="warn">Stopped</span>'; return; }
  fetchMarkers();
  polling = setInterval(fetchPos, 150);
  document.getElementById('status').innerHTML = '<span class="ok">Connecting...</span>';
}

async function fetchPos() {
  const host = document.getElementById('host').value;
  try {
    const r = await fetch(`http://${host}/position`, {signal: AbortSignal.timeout(1000)});
    const d = await r.json();
    lastData = d;
    if (d.n !== undefined) {
      drone = {n: d.n, e: d.e, d: d.d || 0, yaw: d.yaw || 0};
      trail.push({n: d.n, e: d.e, t: Date.now()});
      if (trail.length > MAX_TRAIL) trail.shift();
    }
    if (d.fc) {
      fcDrone = {n: d.fc.n, e: d.fc.e, d: d.fc.d || 0, yaw: d.fc.yaw || 0};
      fcTrail.push({n: d.fc.n, e: d.fc.e, t: Date.now()});
      if (fcTrail.length > MAX_TRAIL) fcTrail.shift();
    }
    if (d.marker_weights) {
      activeWeights = d.marker_weights;
    } else if (d.marker_ids && d.marker_ids.length) {
      activeWeights = {};
      const w = 1.0 / d.marker_ids.length;
      d.marker_ids.forEach(id => activeWeights[String(id)] = w);
    } else {
      activeWeights = {};
    }
    const det = d.detection_rate !== undefined ? (d.detection_rate * 100).toFixed(0) : '?';
    const fps = d.timing ? (1000 / parseInt(d.timing.total || 150)).toFixed(1) : '?';
    document.getElementById('status').innerHTML = `<span class="ok">Connected</span> | FPS: ${fps} | Det: ${det}%`;
    const t = d.timing || {};
    const hasPos = d.n !== undefined;
    const detPct = d.detection_rate !== undefined ? (d.detection_rate * 100).toFixed(0) : '?';
    const detColor = d.detection_rate > 0.5 ? 'ok' : 'err';
    document.getElementById('stats').innerHTML =
      (hasPos ?
        `  N: <span class="val">${d.n.toFixed(3)}</span> m<br>` +
        `  E: <span class="val">${d.e.toFixed(3)}</span> m<br>` +
        `  D: <span class="val">${(d.d||0).toFixed(3)}</span> m<br>` +
        `yaw: <span class="val">${d.yaw.toFixed(1)}</span> deg<br>` +
        `conf: <span class="val">${(d.confidence||0).toFixed(2)}</span><br>`
      : '<span class="err">NO FIX</span><br>') +
      `<br>` +
      `det: <span class="${detColor}">${detPct}%</span><br>` +
      `mkr: <span class="val">${(d.marker_ids||[]).join(', ') || 'none'}</span><br>` +
      `<br>` +
      `frames: <span class="val">${d.frame_count||0}</span><br>` +
      `detections: <span class="val">${d.detection_count||0}</span><br>` +
      `uptime: <span class="val">${(d.uptime||0).toFixed(0)}s</span><br>` +
      (Object.keys(t).length ?
        `<br>timing:<br>` +
        Object.entries(t).map(([k,v]) => `  ${k}: <span class="val">${v}ms</span>`).join('<br>')
      : '');
    updateGauges(d);
    // Body tvec display
    if (d.body_tvec) {
      document.getElementById('bt-fwd').textContent = d.body_tvec.fwd.toFixed(3) + ' m';
      document.getElementById('bt-right').textContent = d.body_tvec.right.toFixed(3) + ' m';
      document.getElementById('bt-down').textContent = d.body_tvec.down.toFixed(3) + ' m';
    } else {
      document.getElementById('bt-fwd').textContent = '—';
      document.getElementById('bt-right').textContent = '—';
      document.getElementById('bt-down').textContent = '—';
    }
    // Body offset (step 4) display
    if (d.body_offset) {
      document.getElementById('bo-fwd').textContent = d.body_offset.fwd.toFixed(3) + ' m';
      document.getElementById('bo-right').textContent = d.body_offset.right.toFixed(3) + ' m';
      document.getElementById('bo-down').textContent = d.body_offset.down.toFixed(3) + ' m';
    } else {
      document.getElementById('bo-fwd').textContent = '—';
      document.getElementById('bo-right').textContent = '—';
      document.getElementById('bo-down').textContent = '—';
    }
  } catch(e) {
    document.getElementById('status').innerHTML = `<span class="err">Error: ${e.message}</span>`;
  }
}

// Mouse: pan + zoom
canvas.addEventListener('mousedown', e => { dragging = true; dragStart = {x: e.clientX, y: e.clientY}; panStart = {x: panX, y: panY}; });
canvas.addEventListener('mousemove', e => { if (!dragging) return; panX = panStart.x + (e.clientX - dragStart.x); panY = panStart.y + (e.clientY - dragStart.y); });
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('mouseleave', () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.max(10, Math.min(500, scale * factor));
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'c') { trail = []; fcTrail = []; } // clear trails
  if (e.key === 'r') { panX = 0; panY = 0; scale = 100; } // reset view
  if (e.key === ' ') { toggle(); e.preventDefault(); } // toggle connection
  if (e.key === 's') { takeSnapshot(); } // snapshot
  if (e.key === 'k') { toggleCamPanel(); } // camera config
});

// YAML import
document.getElementById('yaml-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = reader.result;
    const parsed = [];
    let currentId = null, pos = null, ori = 0;
    for (const line of text.split('\n')) {
      if (line.match(/^\s*#/)) continue; // skip comments
      const idMatch = line.match(/^\s+-\s*id:\s*(\d+)/);
      if (idMatch) {
        if (currentId !== null && pos) parsed.push({id: currentId, n: pos[0], e: pos[1], orientation: ori});
        currentId = parseInt(idMatch[1]); pos = null; ori = 0;
      }
      const posMatch = line.match(/position:\s*\[([-\d.]+),\s*([-\d.]+),\s*([-\d.]+)\]/);
      if (posMatch && currentId !== null) pos = [parseFloat(posMatch[1]), parseFloat(posMatch[2])];
      const oriMatch = line.match(/orientation:\s*([-\d.]+)/);
      if (oriMatch && currentId !== null) ori = parseFloat(oriMatch[1]);
    }
    if (currentId !== null && pos) parsed.push({id: currentId, n: pos[0], e: pos[1], orientation: ori});
    if (parsed.length) {
      markers = parsed;
      document.getElementById('status').innerHTML =
        `<span class="ok">Loaded ${markers.length} markers from ${file.name}</span>`;
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ── Snapshot ──
async function takeSnapshot() {
  const host = document.getElementById('host').value;
  const img = document.getElementById('snap-img');
  const wrap = document.getElementById('snap-wrap');
  try {
    const r = await fetch(`http://${host}/debug-frame`, {signal: AbortSignal.timeout(3000)});
    if (!r.ok) { img.alt = `Error ${r.status}`; wrap.style.display = 'block'; return; }
    const blob = await r.blob();
    img.src = URL.createObjectURL(blob);
    img.alt = '';
    document.getElementById('snap-time').textContent = new Date().toLocaleTimeString();
    wrap.style.display = 'block';
  } catch(e) {
    img.alt = 'Failed: ' + e.message;
    wrap.style.display = 'block';
  }
}

document.getElementById('snap-btn').addEventListener('click', takeSnapshot);
document.getElementById('snap-refresh').addEventListener('click', takeSnapshot);
document.getElementById('snap-close').addEventListener('click', () => {
  document.getElementById('snap-wrap').style.display = 'none';
});

// ── Camera Config ──
const CAM_CONTROLS = [
  { name: 'brightness',    label: 'Brightness',    min: -64,  max: 64,   step: 1 },
  { name: 'contrast',      label: 'Contrast',      min: 0,    max: 64,   step: 1 },
  { name: 'saturation',    label: 'Saturation',    min: 0,    max: 128,  step: 1 },
  { name: 'sharpness',     label: 'Sharpness',     min: 0,    max: 128,  step: 1 },
  { name: 'gain',          label: 'Gain',          min: 0,    max: 255,  step: 1 },
  { name: 'exposure',      label: 'Exposure',      min: -13,  max: -1,   step: 1 },
  { name: 'auto_exposure', label: 'Auto Exp',      min: 0,    max: 3,    step: 1 },
  { name: 'white_balance', label: 'White Bal',     min: 2000, max: 8000, step: 100 },
  { name: 'auto_wb',       label: 'Auto WB',       min: 0,    max: 1,    step: 1 },
  { name: 'focus',         label: 'Focus',         min: 0,    max: 255,  step: 5 },
  { name: 'autofocus',     label: 'Autofocus',     min: 0,    max: 1,    step: 1 },
];

function buildCamControls(currentValues) {
  const container = document.getElementById('cam-controls');
  container.innerHTML = '';
  for (const ctrl of CAM_CONTROLS) {
    const val = currentValues[ctrl.name];
    if (val === undefined) continue;
    const div = document.createElement('div');
    div.className = 'cam-ctrl';
    div.innerHTML = `
      <label>${ctrl.label}</label>
      <input type="number" min="${ctrl.min}" max="${ctrl.max}" step="${ctrl.step}"
             value="${Number(val).toFixed(0)}" data-name="${ctrl.name}">`;
    const input = div.querySelector('input');
    input.addEventListener('change', () => { applyCamSetting(ctrl.name, parseFloat(input.value)); });
    container.appendChild(div);
  }
}

async function loadCamConfig() {
  const host = document.getElementById('host').value;
  try {
    const r = await fetch(`http://${host}/camera-config`, {signal: AbortSignal.timeout(2000)});
    const cfg = await r.json();
    buildCamControls(cfg);
  } catch(e) {
    document.getElementById('cam-controls').innerHTML = '<div style="color:#ff6b6b;font-size:11px">Failed to load config</div>';
  }
}

async function applyCamSetting(name, value) {
  const host = document.getElementById('host').value;
  try {
    await fetch(`http://${host}/camera-config`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({[name]: value}),
      signal: AbortSignal.timeout(2000),
    });
  } catch(e) {}
}

function toggleCamPanel() {
  const panel = document.getElementById('cam-panel');
  if (panel.style.display === 'none' || !panel.style.display) {
    panel.style.display = 'block';
    loadCamConfig();
  } else {
    panel.style.display = 'none';
  }
}

document.getElementById('cam-btn').addEventListener('click', toggleCamPanel);
document.getElementById('cam-close').addEventListener('click', () => {
  document.getElementById('cam-panel').style.display = 'none';
});
document.getElementById('cam-reload').addEventListener('click', loadCamConfig);

// Angle gauges
function drawGauge(canvasId, imuAngle, camAngle, sumAngle, label) {
  const c = document.getElementById(canvasId);
  const g = c.getContext('2d');
  const w = c.width, h = c.height;
  const cx = w/2, cy = h - 15;
  const r = 45;

  g.clearRect(0, 0, w, h);

  // Arc background
  g.strokeStyle = '#333'; g.lineWidth = 2;
  g.beginPath(); g.arc(cx, cy, r, Math.PI, 0); g.stroke();

  // Tick marks
  g.strokeStyle = '#555'; g.lineWidth = 1;
  for (let deg = -90; deg <= 90; deg += 15) {
    const rad = Math.PI + (deg + 90) * Math.PI / 180;
    const inner = deg % 45 === 0 ? r - 10 : r - 5;
    g.beginPath();
    g.moveTo(cx + Math.cos(rad) * inner, cy + Math.sin(rad) * inner);
    g.lineTo(cx + Math.cos(rad) * r, cy + Math.sin(rad) * r);
    g.stroke();
    if (deg % 45 === 0) {
      g.fillStyle = '#666'; g.font = '9px Consolas';
      g.fillText(deg + '', cx + Math.cos(rad) * (r + 12) - 8, cy + Math.sin(rad) * (r + 12) + 3);
    }
  }

  // Zero line
  g.strokeStyle = '#444'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy - r); g.stroke();

  // IMU needle (orange)
  if (imuAngle !== null && imuAngle !== undefined) {
    const imuRad = Math.PI + (imuAngle + 90) * Math.PI / 180;
    g.strokeStyle = '#ffa500'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(cx, cy);
    g.lineTo(cx + Math.cos(imuRad) * (r - 5), cy + Math.sin(imuRad) * (r - 5));
    g.stroke();
    // Label
    g.fillStyle = '#ffa500'; g.font = '11px Consolas';
    g.fillText('IMU ' + imuAngle.toFixed(1) + '\u00B0', 5, 12);
  }

  // Camera needle (cyan)
  if (camAngle !== null && camAngle !== undefined) {
    const camRad = Math.PI + (camAngle + 90) * Math.PI / 180;
    g.strokeStyle = '#00d4ff'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(cx, cy);
    g.lineTo(cx + Math.cos(camRad) * (r - 5), cy + Math.sin(camRad) * (r - 5));
    g.stroke();
    // Label
    g.fillStyle = '#00d4ff'; g.font = '11px Consolas';
    g.fillText('CAM ' + camAngle.toFixed(1) + '\u00B0', w - 80, 12);
  }

  // Sum needle (green) — IMU + camera
  if (sumAngle !== null && sumAngle !== undefined) {
    const sumRad = Math.PI + (sumAngle + 90) * Math.PI / 180;
    g.strokeStyle = '#4ade80'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(cx, cy);
    g.lineTo(cx + Math.cos(sumRad) * (r - 5), cy + Math.sin(sumRad) * (r - 5));
    g.stroke();
    g.fillStyle = '#4ade80'; g.font = '11px Consolas';
    g.fillText('SUM ' + sumAngle.toFixed(1) + '\u00B0', cx - 25, 24);
  }

  // Center dot
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(cx, cy, 3, 0, Math.PI * 2); g.fill();

  // Legend
  g.fillStyle = '#666'; g.font = '9px Consolas';
  g.fillText(label, cx - 15, h - 2);
}

function updateGauges(d) {
  const imuPitch = d.imu_pitch !== undefined ? d.imu_pitch : null;
  const imuRoll = d.imu_roll !== undefined ? d.imu_roll : null;
  const camPitch = d.cam_pitch !== undefined ? d.cam_pitch : null;
  const camRoll = d.cam_roll !== undefined ? d.cam_roll : null;
  const sumPitch = (imuPitch !== null && camPitch !== null) ? imuPitch + camPitch : null;
  const sumRoll = (imuRoll !== null && camRoll !== null) ? imuRoll + camRoll : null;
  drawGauge('pitch-gauge', imuPitch, camPitch, sumPitch, 'pitch');
  drawGauge('roll-gauge', imuRoll, camRoll, sumRoll, 'roll');
}

// Auto-connect
setTimeout(toggle, 500);
</script>
